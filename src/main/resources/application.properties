# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# Perfil de motor de base de datos. Vacio = MySQL (por defecto).
# Con SPRING_PROFILES_ACTIVE=postgres se usa UserRepositoryPostgres y
# PostgresDataSourceSpringConfig, y las configs de MySQL se desactivan.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:users_app}
db.password=${DB_PASSWORD}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# Solo PostgreSQL. El vocabulario es distinto al de MySQL (disable|allow|prefer|require) y en
# minusculas. require es lo que exige Supabase; ponelo en disable solo para un Postgres local.
db.postgres.sslmode=${DB_POSTGRES_SSLMODE:require}

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=${SMTP_HOST:smtp.gmail.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from.address=${SMTP_FROM_ADDRESS:}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

# =============================================
# Seguridad JWT
# =============================================
# JWT_SECRET es OBLIGATORIO: no tiene valor por defecto a proposito. Si la
# aplicacion arranca sin el, falla de inmediato en lugar de firmar tokens con
# una clave que cualquiera con acceso al repositorio podria conocer.
#
# Generar un valor de al menos 32 bytes en Base64:
#   [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
