services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: crud_usuarios
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TiDB Cloud Starter no admite conexiones sin TLS: obliga a cifrar y ademas
      # valida el certificado del servidor. El certificado lo emite Let's Encrypt,
      # asi que el cacerts del JDK ya lo valida y no hace falta truststore propio.
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: Gestion de Usuarios
      # El plan gratuito de Render bloquea el SMTP saliente (25, 465, 587), asi que
      # smtp.* nunca entrega en produccion. Con el perfil "brevo" el envio viaja por
      # HTTPS en el 443, que si esta permitido.
      - key: SPRING_PROFILES_ACTIVE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
